name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type-check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build (tsc)
        run: npm run build

      # Jest + Supertest API tests. External services (Supabase, data layer) are mocked
      # and src/__tests__/setup-test.env.ts provides fake env values, so no secrets are needed.
      - name: Run tests
        run: npm test -- --ci
